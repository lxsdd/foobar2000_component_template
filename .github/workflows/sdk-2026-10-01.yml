name: Probe official foobar2000 SDK 2026-10-01
on:
  pull_request:
    paths:
      - 'ci/probe-sdk-2026-10-01.ps1'
      - '.github/workflows/sdk-2026-10-01.yml'
      - 'validate_template.ps1'
      - 'create_component.ps1'
      - 'template/**'
      - 'vendor/sdk/**'
      - '.sdk-2026-10-01.sha256'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk-compatibility:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Compare official SDK against pinned unmodified mirror, then compile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pinFile = '.sdk-2026-10-01.sha256'
          if (Test-Path -LiteralPath $pinFile) {
            $pin = (Get-Content -LiteralPath $pinFile -Raw).Trim()
            ./ci/probe-sdk-2026-10-01.ps1 -ExpectedSHA256 $pin -VerifyMirror -Build
          } else {
            ./ci/probe-sdk-2026-10-01.ps1 -VerifyMirror -Build
            Write-Host 'Archive SHA-256 is recorded in evidence; source files were compared byte-for-byte with pinned GitHub mirror before build.'
          }
      - name: Upload SHA-256 and build gate report (not SDK binaries)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foobar2000-sdk-2026-10-01-provenance
          path: sdk-probe-evidence/report.txt
          retention-days: 14
          if-no-files-found: warn
