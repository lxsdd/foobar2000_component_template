name: Migration cloud qualification
on:
  push:
    branches: [main, 'migration/**']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
concurrency:
  group: component-template-ci-${{ (github.event_name == 'push' || github.event_name == 'pull_request') && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  qualify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: microsoft/setup-msbuild@v2
      - name: Validate repository and build both architectures
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./tests/test_template.ps1
          ./create_component.ps1 -ComponentId foo_ci_probe -DisplayName 'CI Probe' -Description 'Cloud template qualification' -Destination ci-probe -SkipGitInit
          foreach($platform in @('Win32','x64')) {
            & msbuild 'ci-probe/component.sln' /t:Build /p:Configuration=Release /p:Platform=$platform /p:PlatformToolset=v145 /p:LanguageStandard=stdcpp23 /m:2 /verbosity:minimal
            if($LASTEXITCODE -ne 0){throw "Build failed: $platform"}
          }
      - name: Package manual probe
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: ./ci/package.ps1 -BuildRoot ci-probe -ComponentId foo_ci_probe
      - name: Upload manual probe
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: foo_ci_probe-${{ github.sha }}
          path: candidate/*
          if-no-files-found: error
          retention-days: 14
